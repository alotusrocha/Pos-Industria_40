<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Shadow Filter -->
    <filter id="blockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Face Gradients (Realistic Ornamental Marble Tones) -->
    <linearGradient id="topMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="45%" stop-color="#EFE9DE"/>
      <stop offset="100%" stop-color="#E0D7C7"/>
    </linearGradient>

    <linearGradient id="leftMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD5C4"/>
      <stop offset="70%" stop-color="#CBBFA9"/>
      <stop offset="100%" stop-color="#BDB09A"/>
    </linearGradient>

    <linearGradient id="rightMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAAC94"/>
      <stop offset="60%" stop-color="#A6977E"/>
      <stop offset="100%" stop-color="#8F8069"/>
    </linearGradient>

    <!-- Golden/Emerald Vein Gradient -->
    <linearGradient id="goldVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B89758" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8C6F36" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="32" cy="54" rx="22" ry="6" fill="#000000" opacity="0.3" filter="blur(2px)"/>

  <!-- Main 3D Marble Block Group -->
  <g filter="url(#blockShadow)">
    
    <!-- Top Face (Polished Cut Face) -->
    <path d="M 32,8 L 55,21.5 L 32,35 L 9,21.5 Z" fill="url(#topMarble)" stroke="#E8E0D2" stroke-width="0.8"/>
    
    <!-- Left Face (Dimensioned Sawn Face) -->
    <path d="M 9,21.5 L 32,35 L 32,52 L 9,38.5 Z" fill="url(#leftMarble)" stroke="#CCC0AB" stroke-width="0.8"/>
    
    <!-- Right Face (Shaded Sawn Face) -->
    <path d="M 32,35 L 55,21.5 L 55,38.5 L 32,52 Z" fill="url(#rightMarble)" stroke="#A0927B" stroke-width="0.8"/>

    <!-- Distinctive Natural Marble Veins (Veios de Mármore e Granito) -->
    <!-- Top Face Veins -->
    <path d="M 18,17 Q 27,24 35,21 T 48,27" fill="none" stroke="#9A8E7C" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M 23,13 Q 31,18 39,15 T 45,18" fill="none" stroke="url(#goldVein)" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 15,22 Q 22,27 28,30" fill="none" stroke="#7A6F5E" stroke-width="0.7" opacity="0.4"/>

    <!-- Left Face Veins (Continuing organically over edge) -->
    <path d="M 18,26 Q 24,36 29,43" fill="none" stroke="#7A6F5E" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
    <path d="M 12,31 Q 20,40 25,48" fill="none" stroke="url(#goldVein)" stroke-width="0.8" opacity="0.5"/>
    <path d="M 32,35 L 29,43" fill="none" stroke="#685E4E" stroke-width="0.8" opacity="0.3"/>

    <!-- Right Face Veins -->
    <path d="M 38,40 Q 45,34 51,32" fill="none" stroke="#605442" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <path d="M 34,46 Q 42,42 48,37" fill="none" stroke="url(#goldVein)" stroke-width="0.8" opacity="0.5"/>

    <!-- Polished Bevel Edge Highlights -->
    <path d="M 9,21.5 L 32,35 L 55,21.5" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.7"/>
    <path d="M 32,10 L 32,35 L 32,51.5" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.35"/>
    
    <!-- Top Corner Specular Sparkle (Polished Finish) -->
    <circle cx="32" cy="10" r="1" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
